<script>
/* ---------------- config / column mapping ---------------- */
const FIELD_ALIASES = {
  seller_type:  ["seller_type","sellertype","卖家类型"],
  grass_region: ["grass_region","region","站点","site"],
  l1:           ["cb_level1_global_be_category","level1_global_be_category","level1","l1","品类l1"],
  l2:           ["level2_global_be_category","level2","l2","品类l2"],
  l3:           ["level3_global_be_category","level3","l3","品类l3"],
  keyword:      ["keyword","关键词","热搜词"],
  rank:         ["keyword_rank","rank","keyword_rank(sum)","热度","排名"],
  growth:       ["daily_item_click_growth","daily_item_click_growth(sum)","itemclickgrowth","周趋势"]
};
const REQUIRED_FIELDS = ["seller_type","grass_region","l1","l2","l3","keyword","rank"]; // growth is optional

const SKU_FIELD_ALIASES = {
  grass_region:  ["grass_region","region","站点","site"],
  product_image: ["product_image","image","sku_image","productimage","图片"],
  price:         ["item_current_price_usd","current_price_usd","item_current_price","asp","price_usd"],
  ado:           ["mtd_ado","ado"],
  ado_mom:       ["ado_mom","mtd_ado_mom","ado mom","ado环比","adomom"],
  update_time:   ["update_time","updated_at","更新时间","last_update_time"],
  name:          ["item_name","product_name","sku_name","title"]
};
const SKU_REQUIRED_FIELDS = ["grass_region","product_image","price","ado"]; // ado_mom, update_time & name optional

function norm(s){ return String(s||"").trim().toLowerCase().replace(/[\s_\-\(\)]/g,""); }

function mapHeadersGeneric(headerRow, aliasMap){
  const map = {};
  const normalizedHeaders = headerRow.map(norm);
  for(const key in aliasMap){
    let found = -1;
    for(const alias of aliasMap[key]){
      const na = norm(alias);
      const idx = normalizedHeaders.findIndex(h => h === na || h.includes(na));
      if(idx !== -1){ found = idx; break; }
    }
    map[key] = found;
  }
  return map;
}
function mapHeaders(headerRow){ return mapHeadersGeneric(headerRow, FIELD_ALIASES); }

/* ---------------- fixed data source ---------------- */
const DATA_SOURCE = {
  sheetId: "19HhzGr3FTu_2zZCB3KX-LCpX_mGjpTR5JxMTl0v8Ym8",
  clickGid: "0",
  growthGid: "2137849361",
  skuGid: "25668584",

/* ---------------- state ---------------- */
const state = {

  translationCache: new Map()

const els = {

function setStatus(msg, isErr){

  els.status.className = "status" + (isErr ? " err" : "");

/* ---------------- JSONP loader (bypasses CORS — gviz endpoint sends no CORS headers) ---------------- */
function jsonpFetch(url){
  return new Promise((resolve, reject) => {
    const cbName = "gvizCB_" + Math.random().toString(36).slice(2);
    const script = document.createElement("script");
    let settled = false;
    const timeoutId = setTimeout(() => {
      if(settled) return;
      settled = true;
      cleanup();
      reject(new Error("请求超时，请检查网络连接"));
    }, 15000);

    function cleanup(){
      clearTimeout(timeoutId);
      delete window[cbName];
      script.remove();
    }

    window[cbName] = (json) => {
      if(settled) return;
      settled = true;
      cleanup();
      resolve(json);
    };
    script.onerror = () => {
      if(settled) return;
      settled = true;
      cleanup();
      reject(new Error("加载失败，请确认该 sheet 已设为「知道链接的任何人可查看」"));
    };
    script.src = url + (url.includes("?") ? "&" : "?") + "tqx=out:json;responseHandler:" + cbName;
    document.head.appendChild(script);
  });
}

/* ---------------- fetch + parse a tab into grouped rows ---------------- */
async function fetchTab(sheetId, gid){
  const baseUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?gid=${encodeURIComponent(gid)}`;
  const json = await jsonpFetch(baseUrl);
  if(!json || !json.table || !Array.isArray(json.table.cols)){
    throw new Error("返回数据格式异常，请确认 sheet ID / gid 正确");
  }
  const header = json.table.cols.map(c => (c.label || c.id || "").toString());
  const dataRows = (json.table.rows || []).map(r =>
    (r.c || []).map(cell => {
      if(!cell) return "";
      if(cell.v !== undefined && cell.v !== null) return cell.v;
      if(cell.f !== undefined && cell.f !== null) return cell.f;
      return "";
    })
  );
  const rows = [header, ...dataRows];
  const colMap = mapHeaders(header);
  const missing = REQUIRED_FIELDS.filter(k => colMap[k] === -1);
  if(missing.length){
    throw new Error("未能识别以下列，请检查表头命名：" + missing.join(", "));
  }

  // group + sum rank
  const groups = new Map();
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r || r.every(c => c === "" || c === null || c === undefined)) continue;
    const seller_type = String(r[colMap.seller_type]??"").trim();
    const grass_region = String(r[colMap.grass_region]??"").trim();
    const l1 = String(r[colMap.l1]??"").trim();
    const l2 = String(r[colMap.l2]??"").trim();
    const l3 = String(r[colMap.l3]??"").trim();
    const keyword = String(r[colMap.keyword]??"").trim();
    const rankRaw = String(r[colMap.rank]??"0").replace(/,/g,"").trim();
    const rankVal = parseFloat(rankRaw);
    let growthVal = null;
    if(colMap.growth !== -1){
      const growthRaw = String(r[colMap.growth]??"0").replace(/,/g,"").trim();
      const gv = parseFloat(growthRaw);
      growthVal = isNaN(gv) ? null : gv;
    }
    if(!keyword) continue;
    const key = [seller_type,grass_region,l1,l2,l3,keyword].join("␟");
    if(!groups.has(key)){
      groups.set(key, { seller_type, grass_region, l1, l2, l3, keyword, rank: 0, growthSum: 0, hasGrowth: colMap.growth !== -1 });
    }
    groups.get(key).rank = isNaN(rankVal) ? groups.get(key).rank : rankVal;
    if(growthVal !== null) groups.get(key).growthSum += growthVal;
  }
  const list = Array.from(groups.values());
  list.sort((a,b) => a.rank - b.rank);
  return list;
}

/* ---------------- date formatting helper (handles gviz "Date(y,m,d,h,mi,s)" cells) ---------------- */
function formatUpdateTime(raw){
  if(!raw) return "";
  const m = String(raw).match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)$/);
  let d;
  if(m){
    d = new Date(Number(m[1]), Number(m[2]), Number(m[3]), Number(m[4]||0), Number(m[5]||0), Number(m[6]||0));
  } else {
    d = new Date(raw);
  }
  if(isNaN(d.getTime())) return String(raw);
  const pad = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}时`;
}

/* ---------------- fetch top-sku tab ---------------- */
async function fetchSkuTab(sheetId, gid, sellerTypeLabel){
  const baseUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?gid=${encodeURIComponent(gid)}`;
  const json = await jsonpFetch(baseUrl);
  if(!json || !json.table || !Array.isArray(json.table.cols)){
    throw new Error("返回数据格式异常，请确认 sheet ID / gid 正确");
  }
  const header = json.table.cols.map(c => (c.label || c.id || "").toString());
  const dataRows = (json.table.rows || []).map(r =>
    (r.c || []).map(cell => {
      if(!cell) return "";
      if(cell.v !== undefined && cell.v !== null) return cell.v;
      if(cell.f !== undefined && cell.f !== null) return cell.f;
      return "";
    })
  );
  const colMap = mapHeadersGeneric(header, SKU_FIELD_ALIASES);
  const missing = SKU_REQUIRED_FIELDS.filter(k => colMap[k] === -1);
  if(missing.length){
    throw new Error("未能识别以下列，请检查表头命名：" + missing.join(", "));
  }

  const dedup = new Map(); // key -> best entry
  let updateTime = "";
  for(const r of dataRows){
    if(!r || r.every(c => c === "" || c === null || c === undefined)) continue;
    const grass_region = String(r[colMap.grass_region]??"").trim();
    const image = String(r[colMap.product_image]??"").trim();
    const priceRaw = String(r[colMap.price]??"").replace(/,/g,"").trim();
    const price = parseFloat(priceRaw);
    const adoRaw = String(r[colMap.ado]??"0").replace(/,/g,"").trim();
    const ado = parseFloat(adoRaw);
    let adoMom = null;
    if(colMap.ado_mom !== -1){
      const momRaw = String(r[colMap.ado_mom]??"").replace(/[,%]/g,"").trim();
      const mv = parseFloat(momRaw);
      adoMom = isNaN(mv) ? null : mv;
    }
    const name = colMap.name !== -1 ? String(r[colMap.name]??"").trim() : "";
    if(colMap.update_time !== -1 && !updateTime){
      const ut = String(r[colMap.update_time]??"").trim();
      if(ut) updateTime = ut;
    }
    if(!grass_region && !image) continue;
    const adoVal = isNaN(ado) ? 0 : ado;
    // dedup key: same site + same image (falls back to name) is treated as the same SKU
    const dedupKey = [grass_region, image || name].join("␟");
    const existing = dedup.get(dedupKey);
    if(!existing || adoVal > existing.ado){
      dedup.set(dedupKey, { grass_region, image, price: isNaN(price) ? null : price, ado: adoVal, adoMom, hasAdoMom: colMap.ado_mom !== -1, name, seller_type: sellerTypeLabel });
    }
  }
  const list = Array.from(dedup.values());
  list.sort((a,b) => b.ado - a.ado);
  return { list, updateTime };
}

/* ---------------- auto load on page open ---------------- */
async function loadAll(){
  setStatus("正在加载数据 ...");
  const [clickRes, growthRes, skuLocalRes, skuCncbRes] = await Promise.allSettled([
    fetchTab(DATA_SOURCE.sheetId, DATA_SOURCE.clickGid),
    fetchTab(DATA_SOURCE.sheetId, DATA_SOURCE.growthGid),
    fetchSkuTab(DATA_SOURCE.sheetId, DATA_SOURCE.skuGid, "CNLS本土"),
    fetchSkuTab(DATA_SOURCE.sheetId, DATA_SOURCE.skuCncbGid, "CNCB跨境")
  ]);

  const errMsgs = [];

  if(clickRes.status === "fulfilled"){
    state.datasets.click = clickRes.value;
  } else {
    errMsgs.push("click 加载失败：" + clickRes.reason.message);
  }

  if(growthRes.status === "fulfilled"){
    state.datasets.growth = growthRes.value;
  } else {
    state.datasets.growth = null;
    errMsgs.push("growth 加载失败：" + growthRes.reason.message);
  }

  const skuList = [];
  let skuUpdateTime = "";

  if(skuLocalRes.status === "fulfilled"){
    skuList.push(...skuLocalRes.value.list);
    if(skuLocalRes.value.updateTime) skuUpdateTime = skuLocalRes.value.updateTime;
  } else {
    errMsgs.push("top sku（本土）加载失败：" + skuLocalRes.reason.message);
  }

  if(skuCncbRes.status === "fulfilled"){
    skuList.push(...skuCncbRes.value.list);
    if(!skuUpdateTime && skuCncbRes.value.updateTime) skuUpdateTime = skuCncbRes.value.updateTime;
  } else {
    errMsgs.push("top sku CNCB（跨境）加载失败：" + skuCncbRes.reason.message);
  }

  skuList.sort((a,b) => b.ado - a.ado);
  state.datasets.sku = (skuLocalRes.status === "fulfilled" || skuCncbRes.status === "fulfilled") ? skuList : null;
  state.skuUpdateTime = skuUpdateTime;

  setStatus(errMsgs.join(" ・ "), errMsgs.length > 0);
  els.lastUpdated.textContent = "最近加载：" + new Date().toLocaleString("zh-CN");

  populateFilters();
  render();

  populateSkuFilters();
  renderSku();
}

window.addEventListener("DOMContentLoaded", loadAll);

/* ---------------- page-level tab switch ---------------- */
function setPageTab(page){
  state.activePage = page;
  els.pageTabKeyword.classList.toggle("active", page === "keyword");
  els.pageTabSku.classList.toggle("active", page === "sku");
  els.pageKeyword.style.display = page === "keyword" ? "" : "none";
  els.pageSku.style.display = page === "sku" ? "" : "none";
}
els.pageTabKeyword.addEventListener("click", () => setPageTab("keyword"));
els.pageTabSku.addEventListener("click", () => setPageTab("sku"));

/* ---------------- sort toggle ---------------- */
function setActiveTab(tab){
  if(tab === "growth" && !state.datasets.growth){
    setStatus("growth 数据尚未加载成功，请刷新页面重试", true);
    return;
  }
  state.activeTab = tab;
  els.sortClick.classList.toggle("active", tab === "click");
  els.sortGrowth.classList.toggle("active", tab === "growth");
  populateFilters();
  render();
}
els.sortClick.addEventListener("click", () => setActiveTab("click"));
els.sortGrowth.addEventListener("click", () => setActiveTab("growth"));

/* ---------------- filters ---------------- */
function uniqueSorted(arr){ return Array.from(new Set(arr.filter(Boolean))).sort((a,b)=>a.localeCompare(b,"zh")); }

function fillSelect(sel, values, currentVal){
  const keep = currentVal && values.includes(currentVal) ? currentVal : "";
  sel.innerHTML = `<option value="">${sel.dataset.allLabel}</option>` +
    values.map(v => `<option value="${escapeAttr(v)}">${escapeHtml(v)}</option>`).join("");
  sel.value = keep;
}
els.f_region.dataset.allLabel = "全部站点";
els.f_l1.dataset.allLabel = "全部品类 L1";
els.f_l2.dataset.allLabel = "全部品类 L2";
els.f_l3.dataset.allLabel = "全部品类 L3";

function currentData(){
  return state.datasets[state.activeTab] || [];
}

function populateFilters(){
  const data = currentData();
  fillSelect(els.f_region, uniqueSorted(data.map(d=>d.grass_region)), els.f_region.value);
  refreshCascadingCategoryFilters();
}

function filteredBase(){
  // apply region only (used to compute cascading category options)
  return currentData().filter(d =>
    (!els.f_region.value || d.grass_region === els.f_region.value)
  );
}

function refreshCascadingCategoryFilters(){
  const base = filteredBase();
  fillSelect(els.f_l1, uniqueSorted(base.map(d=>d.l1)), els.f_l1.value);
  const afterL1 = base.filter(d => !els.f_l1.value || d.l1 === els.f_l1.value);
  fillSelect(els.f_l2, uniqueSorted(afterL1.map(d=>d.l2)), els.f_l2.value);
  const afterL2 = afterL1.filter(d => !els.f_l2.value || d.l2 === els.f_l2.value);
  fillSelect(els.f_l3, uniqueSorted(afterL2.map(d=>d.l3)), els.f_l3.value);
}

[els.f_region].forEach(sel => sel.addEventListener("change", () => {
  refreshCascadingCategoryFilters();
  render();
}));
[els.f_l1, els.f_l2].forEach(sel => sel.addEventListener("change", () => {
  refreshCascadingCategoryFilters();
  render();
}));
[els.f_l3, els.f_topn].forEach(sel => sel.addEventListener("change", render));

els.resetBtn.addEventListener("click", () => {
  [els.f_region, els.f_l1, els.f_l2, els.f_l3].forEach(s => s.value = "");
  els.f_topn.value = "30";
  refreshCascadingCategoryFilters();
  render();
});

function applyFilters(){
  return currentData().filter(d =>
    (!els.f_region.value || d.grass_region === els.f_region.value) &&
    (!els.f_l1.value || d.l1 === els.f_l1.value) &&
    (!els.f_l2.value || d.l2 === els.f_l2.value) &&
    (!els.f_l3.value || d.l3 === els.f_l3.value)
  );
}

/* ---------------- sku filters + render ---------------- */
els.f_sku_region.dataset.allLabel = "全部站点";

function skuFilteredBySellerType(){
  const data = state.datasets.sku || [];
  return data.filter(d => !els.f_sku_sellertype.value || d.seller_type === els.f_sku_sellertype.value);
}

function populateSkuFilters(){
  const base = skuFilteredBySellerType();
  fillSelect(els.f_sku_region, uniqueSorted(base.map(d=>d.grass_region)), els.f_sku_region.value);
}
els.f_sku_sellertype.addEventListener("change", () => {
  populateSkuFilters();
  renderSku();
});
[els.f_sku_region, els.f_sku_topn].forEach(sel => sel.addEventListener("change", renderSku));

function skuMomHtml(d){
  if(!d.hasAdoMom || d.adoMom === null){
    return `<span class="trend-na">—</span>`;
  }
  if(d.adoMom > 0) return `<span class="trend-up">▲</span>`;
  if(d.adoMom < 0) return `<span class="trend-down">▼</span>`;
  return `<span class="trend-flat">–</span>`;
}

function renderSku(){
  const filtered = skuFilteredBySellerType().filter(d => !els.f_sku_region.value || d.grass_region === els.f_sku_region.value);
  const topNRaw = parseInt(els.f_sku_topn.value, 10);
  const topN = isNaN(topNRaw) ? 30 : topNRaw;
  const shown = topN > 0 ? filtered.slice(0, topN) : filtered;

  els.skuUpdateTimeEl.textContent = formatUpdateTime(state.skuUpdateTime) || "—";

  if(!shown.length){
    els.skuGrid.innerHTML = `<div class="sku-empty">没有匹配当前筛选条件的数据</div>`;
    return;
  }

  els.skuGrid.innerHTML = shown.map((d, i) => {
    const priceText = (d.price !== null && !isNaN(d.price)) ? `$${d.price.toFixed(2)}` : "—";
    const imgHtml = d.image
      ? `<img src="${escapeAttr(d.image)}" alt="${escapeAttr(d.name||'')}" loading="lazy" onerror="this.closest('.sku-image-wrap').classList.add('no-image'); this.replaceWith(document.createTextNode('无图片'));">`
      : `无图片`;
    return `<div class="sku-card">
      <div class="sku-image-wrap">${imgHtml}</div>
      <div class="sku-body">
        ${d.name ? `<div class="sku-name" title="${escapeAttr(d.name)}">${escapeHtml(d.name)}</div>` : ""}
        <div class="sku-price">${priceText}</div>
        <div class="sku-ado">Rank No.${i + 1}</div>
        <div class="sku-mom">日均销量环比：${skuMomHtml(d)}</div>
        <div class="sku-badges">
          <span class="badge sku-region">站点：${d.grass_region ? escapeHtml(d.grass_region) : "—"}</span>
          <span class="badge sku-sellertype">${escapeHtml(d.seller_type||"")}</span>
        </div>
      </div>
    </div>`;
  }).join("");
}

/* ---------------- render ---------------- */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

function trendCellHtml(d){
  if(state.activeTab !== "click" || !d.hasGrowth){
    return `<span class="trend-na">—</span>`;
  }
  if(d.growthSum > 0) return `<span class="trend-up">▲</span>`;
  if(d.growthSum < 0) return `<span class="trend-down">▼</span>`;
  return `<span class="trend-flat">–</span>`;
}

function render(){
  const rows = applyFilters();
  const topN = parseInt(els.f_topn.value, 10) || 30;
  const shown = rows.slice(0, topN);

  els.rowCount.textContent = `${state.activeTab === "click" ? "热搜榜" : "趋势榜"} · 共 ${rows.length} 个关键词，显示前 ${shown.length} 个`;

  if(!shown.length){
    els.tbody.innerHTML = `<tr class="empty-row"><td colspan="9">没有匹配当前筛选条件的数据</td></tr>`;
    return;
  }

  els.tbody.innerHTML = shown.map((d,i) => {
    const cacheKey = d.keyword;
    const cached = state.translationCache.get(cacheKey);
    const zhCell = cached
      ? `<span>${escapeHtml(cached)}</span>`
      : `<span class="zh-pending" data-kw="${escapeAttr(cacheKey)}">翻译中…</span>`;
    return `<tr>
      <td>${escapeHtml(d.seller_type)}</td>
      <td><span class="badge">${escapeHtml(d.grass_region)}</span></td>
      <td>${escapeHtml(d.l1)}</td>
      <td>${escapeHtml(d.l2)}</td>
      <td>${escapeHtml(d.l3)}</td>
      <td class="kw">${escapeHtml(d.keyword)}</td>
      <td class="zh${cached?"":" pending"}" id="zh-${i}">${zhCell}</td>
      <td class="rank"><span class="rank-num">${d.rank.toLocaleString()}</span></td>
      <td class="trend-cell">${trendCellHtml(d)}</td>
    </tr>`;
  }).join("");

  translateVisible(shown);
}

/* ---------------- lazy translation via MyMemory (free, no key) ---------------- */
let translateQueue = Promise.resolve();
function translateVisible(rows){
  const toTranslate = rows.filter(d => !state.translationCache.has(d.keyword));
  const uniqueKeywords = Array.from(new Set(toTranslate.map(d => d.keyword)));
  uniqueKeywords.forEach(kw => {
    translateQueue = translateQueue.then(() => translateOne(kw)).then(zh => {
      state.translationCache.set(kw, zh);
      document.querySelectorAll(`.zh-pending[data-kw]`).forEach(span => {
        if(span.dataset.kw === kw){
          span.textContent = zh;
          span.parentElement.classList.remove("pending");
        }
      });
    }).catch(() => {
      state.translationCache.set(kw, kw); // fallback: show original
      document.querySelectorAll(`.zh-pending[data-kw]`).forEach(span => {
        if(span.dataset.kw === kw){
          span.textContent = kw;
          span.parentElement.classList.remove("pending");
        }
      });
    }).then(() => new Promise(r => setTimeout(r, 120))); // gentle throttle
  });
}

async function translateOne(text){
  const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|zh-CN`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("translate http error");
  const json = await res.json();
  const zh = json && json.responseData && json.responseData.translatedText;
  if(!zh) throw new Error("no translation");
  return zh;
}

/* ---------------- export ---------------- */
els.exportBtn.addEventListener("click", () => {
  const rows = applyFilters();
  const topN = parseInt(els.f_topn.value, 10) || 30;
  const shown = rows.slice(0, topN);
  if(!shown.length){ setStatus("没有可导出的数据", true); return; }
  const header = ["seller_type","grass_region","cb_level1_global_be_category","level2_global_be_category","level3_global_be_category","keyword","keyword_zh","keyword_rank","周趋势"];
  const lines = [header.join(",")];
  shown.forEach(d => {
    const zh = state.translationCache.get(d.keyword) || "";
    const trendText = state.activeTab !== "click" || !d.hasGrowth ? "" : (d.growthSum > 0 ? "上升" : d.growthSum < 0 ? "下降" : "持平");
    const vals = [d.seller_type,d.grass_region,d.l1,d.l2,d.l3,d.keyword,zh,d.rank,trendText]
      .map(v => `"${String(v).replace(/"/g,'""')}"`);
    lines.push(vals.join(","));
  });
  const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `热搜词_${state.activeTab}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
});
</script>
